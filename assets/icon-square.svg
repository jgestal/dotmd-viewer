<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SimpleDotMD app icon, square variant for Windows and Linux: the same artwork as icon.svg,
       with the body filling the 1024 canvas edge to edge (rounded square, 18 % radius) and no drop shadow.
       Rendered by scripts/render-icon.mjs. -->
  <defs>
    <clipPath id="body"><rect width="1024" height="1024" rx="184"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1f6f6a"/>
      <stop offset="0.55" stop-color="#0f3d3e"/>
      <stop offset="1" stop-color="#082526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#6fe0c8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6fe0c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f1e8d4"/>
    </linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e1cd"/>
      <stop offset="1" stop-color="#d9ceb5"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2d6bc"/>
      <stop offset="1" stop-color="#cbbd9e"/>
    </linearGradient>
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#021615" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#d7efe9" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd173"/>
      <stop offset="1" stop-color="#e29a1e"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="632" cy="676" r="112"/></clipPath>
    <filter id="lensShadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#021615" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g clip-path="url(#body)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#shine)"/>

    <!-- a sheet behind, slightly turned -->
    <g filter="url(#sheetShadow)" transform="rotate(7 520 560)">
      <rect x="262" y="236" width="520" height="610" rx="26" fill="url(#paper2)"/>
    </g>
    <!-- the page, with a folded corner -->
    <g filter="url(#sheetShadow)" transform="rotate(-3 512 540)">
      <path d="M262 214 H668 L792 338 V830 a28 28 0 0 1 -28 28 H290 a28 28 0 0 1 -28 -28 V242 a28 28 0 0 1 28 -28 Z" fill="url(#paper)"/>
      <path d="M668 214 V310 a28 28 0 0 0 28 28 H792 Z" fill="url(#fold)"/>
      <text x="300" y="548" font-family="Courier Prime" font-weight="700" font-size="236" fill="#1f2230" letter-spacing="-8"><tspan fill="#e0483e">.</tspan>md</text>
      <g stroke="#d9cdb0" stroke-width="14" stroke-linecap="round">
        <line x1="316" y1="648" x2="716" y2="648"/>
        <line x1="316" y1="716" x2="664" y2="716"/>
        <line x1="316" y1="784" x2="604" y2="784"/>
      </g>
    </g>

    <!-- the viewer's signature: a magnifier over the lower right of the page -->
    <g filter="url(#lensShadow)">
      <line x1="712" y1="756" x2="822" y2="866" stroke="#b9780f" stroke-width="64" stroke-linecap="round"/>
      <line x1="712" y1="756" x2="822" y2="866" stroke="url(#rim)" stroke-width="50" stroke-linecap="round"/>
      <circle cx="632" cy="676" r="132" fill="url(#rim)"/>
    </g>
    <circle cx="632" cy="676" r="112" fill="url(#glass)"/>
    <!-- a text line, magnified inside the lens -->
    <g clip-path="url(#lensClip)" stroke="#0f3d3e" stroke-linecap="round">
      <line x1="500" y1="640" x2="780" y2="640" stroke-width="30"/>
      <line x1="500" y1="710" x2="700" y2="710" stroke-width="30" stroke="#8aa8a3"/>
    </g>
    <path d="M556 640 A84 84 0 0 1 626 586" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
    <circle cx="632" cy="676" r="112" fill="none" stroke="#b9780f" stroke-opacity="0.5" stroke-width="6"/>
  </g>
  <!-- hairline edge, as on macOS icons -->
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="182.8" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
</svg>
