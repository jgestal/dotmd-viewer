name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WebDriver through tauri-driver: WebKitWebDriver on Linux, msedgedriver on Windows.
  # macOS has no WebDriver for WKWebView, so it only gets a start-up smoke test below.
  webdriver:
    name: WebDriver (${{ matrix.os }})
    # TODO: Windows does not get a session yet. msedgedriver matches the WebView2 runtime
    # (155.0.4283.62) but the app's WebView2 never opens the remote debugging port (not through
    # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS nor the AdditionalBrowserArguments policy), so it fails
    # with "DevToolsActivePort file doesn't exist". Make it blocking once that is solved.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Install msedgedriver matching the installed WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          $driverDir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force $driverDir | Out-Null
          Push-Location $driverDir
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          Pop-Location
          "NATIVE_WEBDRIVER=$driverDir\msedgedriver.exe" >> $env:GITHUB_ENV
      - name: Build app without bundling
        run: npx tauri build --debug --no-bundle
      - name: Run E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Run E2E tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: e2e/screenshots
          if-no-files-found: ignore

  smoke-macos:
    name: Start-up smoke (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app without bundling
        run: npx tauri build --debug --no-bundle
      - name: App starts with a document and stays up
        run: |
          src-tauri/target/debug/simpledotmd e2e/fixtures/sample.md &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "The app exited during start-up"; exit 1; }
          kill "$pid"
          wait "$pid" || true
