name: Mutation testing

# Manual only: mutation testing runs locally before a release, not on every pull request.
on:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - run: npm ci

      - name: Mutation testing (TypeScript)
        run: npm run test:mutation

      - name: Mutation testing (Rust)
        run: npm run test:mutation:rust

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports
          path: reports/
