[package]
name = "dotmd-viewer"
version = "0.0.1"
description = "Cross-platform Markdown viewer with optional editing"
authors = ["Juan Gestal <juan@gestal.es>"]
repository = "https://github.com/jgestal/dotmd-viewer"
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "dotmd_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "0.59.0", default-features = false }
encoding_rs = "0.8.42"
tempfile = "3.27.0"
unicode-normalization = "0.1"
notify-debouncer-mini = "0.7.0"
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSGeometry", "NSDictionary", "NSObject"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
